<nav class="flex-row btw middle">
  <!-- start -->
  <div class="flex-row w-100 middle left">
    <div
      *ngIf="playerService.player.state.currentJobActive"
      class="flex-row w-100 middle left">
      <p>
        {{ playerService.player.state.currentJobActive.type | translate }}
      </p>
      <div class="bar-container w-100">
        <p class="text">
          {{ playerService.player.state.currentJobActive.currentExperience }} /
          {{ playerService.player.state.currentJobActive.nextLevelExperience }}
        </p>
        <div
          class="bar"
          [ngStyle]="{
            width:
              (playerService.player.state.currentJobActive.currentExperience /
                playerService.player.state.currentJobActive
                  .nextLevelExperience) *
                100 +
              '%'
          }"></div>
      </div>
    </div>
  </div>
  <div *ngIf="loadingService.loadComplete">
    <button class="primary flex-row middle left" (click)="saveGame()">
      <app-icon
        *ngIf="loadingService.saving"
        name="loader"
        size="1rem"></app-icon>
      Save
    </button>
  </div>

  <!-- end -->
  <div class="flex-row middle right" *ngIf="!loadingService.loadComplete">
    <a routerLink="/game/loading" routerLinkActive="active">Play</a>
  </div>
</nav>
